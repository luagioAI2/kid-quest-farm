<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 72" fill="none">
  <ellipse cx="48" cy="63.5" rx="29" ry="3.2" fill="#7A2440" opacity=".13"/>

  <!--
    画成**摊开的册子**，不是一张卡。
    ⚠️ 上一版是「一张黄卡 + 一圈白内框 + 底下同色系的一叠纸」：
       白内框就是画框，底下那叠纸和底色几乎同色、根本看不见 ⇒ 读成一张相片。
       摊开之后，「书脊」+「左右两页」是任何尺寸下都不会读错的结构。
  -->
  <g transform="rotate(-5 48 37)">
    <!-- 封面：从书页四周露出 3~4px 的黄，这是「一本」而不是「一张」的判据 -->
    <rect x="10" y="15" width="76" height="44" rx="4.5" fill="#FFC247"/>
    <!-- 书脊：两页之间那 5px 的封面，压深一档 -->
    <rect x="45.5" y="18.5" width="5" height="37" fill="#F0B84E"/>
    <!-- 左右两页 -->
    <rect x="14" y="18.5" width="31.5" height="37" rx="2" fill="#FFFFFF"/>
    <rect x="50.5" y="18.5" width="31.5" height="37" rx="2" fill="#FFFFFF"/>

    <!-- 左页：星 / 圆 / 心，三种形状就够，多了是色斑 -->
    <g transform="translate(25 30) scale(1.15)">
      <path d="M0 -5 L1.234 -1.699 L4.755 -1.545 L1.997 .649 L2.939 4.045 L0 2.1 L-2.939 4.045 L-1.997 .649 L-4.755 -1.545 L-1.234 -1.699 Z" fill="#FF6FA8"/>
    </g>
    <circle cx="37" cy="30.5" r="4" fill="#A8DE86"/>
    <g transform="translate(33 44) scale(1.1)">
      <path d="M0 4.6C-2.9 2.6-4.6 1.3-4.6-.5A2.5 2.5 0 0 1 0-1.9 2.5 2.5 0 0 1 4.6-.5C4.6 1.3 2.9 2.6 0 4.6Z" fill="#8FD3EE"/>
    </g>

    <!-- 右页：形状错开摆，别和左页对称 -->
    <g transform="translate(60 29.5)">
      <path d="M0 -5 L1.234 -1.699 L4.755 -1.545 L1.997 .649 L2.939 4.045 L0 2.1 L-2.939 4.045 L-1.997 .649 L-4.755 -1.545 L-1.234 -1.699 Z" fill="#FFD264"/>
    </g>
    <g transform="translate(71.5 31) scale(1.1)">
      <path d="M0 4.6C-2.9 2.6-4.6 1.3-4.6-.5A2.5 2.5 0 0 1 0-1.9 2.5 2.5 0 0 1 4.6-.5C4.6 1.3 2.9 2.6 0 4.6Z" fill="#FF6FA8"/>
    </g>
    <circle cx="64" cy="45" r="4.5" fill="#C8A2F0"/>
  </g>

  <!-- 闪光：只放一颗。⚠️ 上一版右边那颗被册子压住一半，
       露出来的一角读成「边上粘了个黄点」，不是闪光 —— 宁缺勿滥 -->
  <path d="M7.6 8.6l1.2 3.3 3.3 1.2-3.3 1.2-1.2 3.3-1.2-3.3L3.1 13.1l3.3-1.2Z" fill="#FFD264"/>
</svg>
