<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 72" fill="none">
  <ellipse cx="47" cy="63" rx="26" ry="3.2" fill="#7A2440" opacity=".13"/>

  <!-- 底下一叠贴纸页：只露一圈白边，说明「是一本，不是一张」 -->
  <g transform="rotate(7 50 36)">
    <rect x="30" y="12" width="44" height="46" rx="4" fill="#FFFFFF"/>
    <rect x="30" y="12" width="44" height="46" rx="4" fill="#FFD9E2"/>
  </g>

  <!-- 封面：歪着压在纸页上 -->
  <g transform="rotate(-8 43 38)">
    <rect x="20" y="15" width="46" height="46" rx="4.4" fill="#FFC247"/>
    <rect x="20" y="15" width="46" height="46" rx="4.4" fill="#FFFFFF" opacity=".18"/>
    <rect x="25" y="20" width="36" height="36" rx="3" stroke="#FFFFFF" stroke-width="1.1" opacity=".55"/>

    <!-- 封面上三张「贴纸」：星 / 心 / 圆点，颜色取整套里最跳的三个 -->
    <path d="M33 27.6l2.3 4.7 5.2.8-3.8 3.6.9 5.1-4.6-2.4-4.6 2.4.9-5.1-3.8-3.6 5.2-.8Z" fill="#FF6FA8"/>
    <path d="M48.6 41.4c-2.6-1.8-4.2-3-4.2-4.8a2.3 2.3 0 0 1 4.2-1.3 2.3 2.3 0 0 1 4.2 1.3c0 1.8-1.6 3-4.2 4.8Z" fill="#8FD3EE"/>
    <circle cx="37.4" cy="48.4" r="4.4" fill="#A8DE86"/>
  </g>

  <!-- 闪光：一大两小、不对称，对称摆会变成花纹 -->
  <path d="M14.6 20.4l1.5 4.2 4.2 1.5-4.2 1.5-1.5 4.2-1.5-4.2-4.2-1.5 4.2-1.5Z" fill="#FFD264"/>
  <path d="M79.6 15.6l1.1 3 3 1.1-3 1.1-1.1 3-1.1-3-3-1.1 3-1.1Z" fill="#FFD264"/>
  <path d="M85.4 46.6l.9 2.5 2.5.9-2.5.9-.9 2.5-.9-2.5-2.5-.9 2.5-.9Z" fill="#FFE9A8"/>
</svg>
