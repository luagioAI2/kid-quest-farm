    <!--
      字体策略：不引用任何外部字体服务。
      这是一个离线优先的 App（APK / 无网环境都是主要场景），
      外链不只拖慢首屏，还会在离线时产生一堆网络错误。
      卡通感改由「系统自带圆体」承担：中文优先圆体/苹方，
      西文优先 Verdana/Trebuchet，都是各平台默认安装、零下载。
    -->
    <style>
      :root {
        --font-cartoon-cn: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei UI',
          'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
        --font-cartoon-en: 'Trebuchet MS', 'Verdana', 'Segoe UI', system-ui, sans-serif;
      }
    </style>
  </head>

    <div id="root"></div>
