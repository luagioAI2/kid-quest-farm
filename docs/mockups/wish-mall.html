<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>心愿商城 · UI 稿</title>
<style>
:root{
  --paper:#fffaf2; --paper2:#fff6ea;
  --ink900:#33281e; --ink700:#574838; --ink600:#7a6857; --ink500:#9a8875;
  --ink300:#cbbba8; --ink200:#e2d6c6; --ink100:#efe6d9;
  --sun100:#fef3c7; --sun200:#fde68a; --sun400:#fbbf24; --sun500:#f59e0b; --sun600:#d97706;
  --grass100:#dcfce7; --grass300:#86efac; --grass400:#4ade80; --grass500:#22c55e; --grass600:#16a34a; --grass700:#15803d;
  --berry100:#ffe4e6; --berry400:#fb7185; --berry500:#f43f5e;
  --sky100:#e0f2fe; --sky400:#38bdf8; --sky500:#0ea5e9;
  --grape100:#ede9fe; --grape400:#a78bfa; --grape500:#8b5cf6;
  --tan100:#ffedd5; --tan400:#fb923c; --tan500:#f97316;
  --card-r:20px; --btn-r:14px;
  --shadow-flat:0 1px 2px rgb(51 40 30 / .05), 0 6px 16px -10px rgb(51 40 30 / .18);
  --shadow-float:0 8px 28px -10px rgb(51 40 30 / .22), 0 2px 6px -2px rgb(51 40 30 / .08);
  --hairline:inset 0 0 0 1px rgb(51 40 30 / .07);
  --fd:'Trebuchet MS','Verdana','PingFang SC','Hiragino Sans GB','Microsoft YaHei UI',system-ui,sans-serif;
  --fb:'PingFang SC','Hiragino Sans GB','Microsoft YaHei UI','Microsoft YaHei','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:var(--fb);color:var(--ink900);
  background:#efe7da;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:20px 12px 40px;gap:16px;
}

/* ---------- 屏选择器 ---------- */
.switch{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:820px}
.switch button{
  font-family:var(--fb);font-size:12px;padding:7px 11px;border-radius:999px;cursor:pointer;
  border:0;background:#fff;color:var(--ink600);box-shadow:var(--hairline);
}
.switch button.on{background:var(--ink900);color:#fff}
.switch button:not(.on):hover{background:var(--paper2)}

/* ---------- 手机框 ---------- */
.phone{
  width:390px;height:844px;background:var(--paper);border-radius:38px;overflow:hidden;
  display:flex;flex-direction:column;position:relative;
  box-shadow:0 24px 60px -20px rgb(51 40 30 / .35),0 0 0 9px #fff,0 0 0 10px rgb(51 40 30 / .08);
}
.statusbar{
  height:42px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;font-family:var(--fd);font-size:13px;font-weight:700;color:var(--ink900);
}
.statusbar .dots{display:flex;gap:3px;align-items:center}
.statusbar .dots i{width:3px;height:3px;border-radius:50%;background:var(--ink900);display:block}
.statusbar .bat{width:20px;height:10px;border:1.5px solid var(--ink900);border-radius:3px;position:relative;margin-left:5px}
.statusbar .bat::after{content:"";position:absolute;inset:1.5px;right:6px;background:var(--ink900);border-radius:1px}

/* ---------- 顶栏 ---------- */
.hud{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:2px 16px 10px;border-bottom:1px solid rgb(51 40 30 / .07);
}
.hud .day{font-family:var(--fd);font-size:12px;font-weight:700;color:var(--ink500);white-space:nowrap}
.wallet{display:flex;gap:5px}
.pill{
  display:inline-flex;align-items:center;gap:4px;background:#fff;border-radius:999px;
  padding:4px 9px;font-size:12px;font-weight:700;font-family:var(--fd);color:var(--ink700);
  box-shadow:var(--hairline);white-space:nowrap;
}
.pill em{font-style:normal;font-size:11px}
.pill.gold{background:var(--sun100);color:var(--sun600)}
.pill.leaf{background:var(--grass100);color:var(--grass700)}
.pill.gem{background:var(--sky100);color:#0369a1}

/* ---------- 页面骨架 ---------- */
main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.page{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:0 16px 18px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

.pagehead{padding:12px 16px 0}
.pagehead h1{font-family:var(--fd);font-size:21px;font-weight:700;margin:0;letter-spacing:.2px}
.pagehead p{margin:3px 0 0;font-size:12px;color:var(--ink500)}

/* ---------- 分类 chips ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;font-family:var(--fb);font-size:13px;padding:7px 13px;border-radius:999px;
  border:0;background:#fff;color:var(--ink600);cursor:pointer;box-shadow:var(--hairline);
}
.chip.on{background:var(--ink900);color:#fff;box-shadow:none;font-weight:600}

/* ---------- 盲盒 hero ---------- */
.hero{
  position:relative;display:flex;gap:13px;align-items:center;
  background:var(--sun100);border-radius:var(--card-r);padding:14px;
  box-shadow:var(--shadow-flat),var(--hairline);margin-bottom:14px;cursor:pointer;
}
.hero .thumb{width:64px;height:64px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;flex:0 0 auto;box-shadow:var(--hairline)}
.hero .t{font-family:var(--fd);font-size:16px;font-weight:700;margin-bottom:3px}
.hero .d{font-size:12px;color:var(--ink600);line-height:1.45}
.hero .price{margin-top:7px;display:flex;align-items:center;gap:8px}
.tag-new{
  position:absolute;top:-6px;right:12px;background:var(--berry500);color:#fff;
  font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;font-family:var(--fd);
}

/* ---------- 商品网格 ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{
  background:#fff;border-radius:var(--card-r);padding:9px;box-shadow:var(--shadow-flat),var(--hairline);
  cursor:pointer;display:flex;flex-direction:column;
}
.card .thumb{
  aspect-ratio:4/3;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:34px;margin-bottom:8px;position:relative;
}
.card .name{font-size:13px;font-weight:600;line-height:1.35;margin:0 2px}
.card .meta{font-size:11px;color:var(--ink500);margin:3px 2px 0}
.card .foot{margin:7px 2px 2px;display:flex;align-items:center;gap:5px}
.badge{
  display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;
  font-family:var(--fd);padding:3px 7px;border-radius:999px;
}
.badge.v{background:var(--grass100);color:var(--grass700)}
.badge.lock{background:var(--ink100);color:var(--ink500);font-weight:400}
.badge.dim{background:var(--ink100);color:var(--ink500)}
.badge.hot{background:var(--berry100);color:#b91c3c}

/* ---------- 详情页 ---------- */
.navbar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:6px 16px 10px;
}
.back{
  width:34px;height:34px;border-radius:11px;border:0;background:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink700);
  box-shadow:var(--hairline);flex:0 0 auto;
}
.navbar .ttl{font-family:var(--fd);font-size:15px;font-weight:700}
.navbar .spacer{flex:1}

.heroimg{
  aspect-ratio:4/3;border-radius:var(--card-r);display:flex;align-items:center;justify-content:center;
  font-size:84px;margin:0 16px;box-shadow:var(--shadow-flat),var(--hairline);
}
.titleblock{padding:16px 16px 0}
.titleblock h2{font-family:var(--fd);font-size:19px;font-weight:700;margin:0;line-height:1.35}
.titleblock .from{font-size:12px;color:var(--ink500);margin-top:5px;display:flex;align-items:center;gap:6px}
.srcline{
  display:inline-flex;align-items:center;gap:4px;background:#fff;border-radius:999px;
  padding:2px 8px;font-size:11px;color:var(--ink600);box-shadow:var(--hairline);
}
.facts{display:flex;gap:8px;padding:14px 16px 0;flex-wrap:wrap}
.fact{background:#fff;border-radius:12px;padding:8px 11px;box-shadow:var(--hairline);flex:1;min-width:0}
.fact .k{font-size:10px;color:var(--ink500);margin-bottom:2px}
.fact .v{font-family:var(--fd);font-size:13px;font-weight:700}
.note{padding:14px 16px 0;font-size:13px;color:var(--ink600);line-height:1.65}

/* 进度条 */
.prog{padding:16px 16px 0}
.prog .row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink500);margin-bottom:6px}
.prog .row b{font-family:var(--fd);font-size:13px;color:var(--ink900)}
.bar{height:9px;background:var(--ink100);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--grass500)}
.prog .hint{font-size:11px;color:var(--ink500);margin-top:6px}

/* 底部动作条 */
.actionbar{
  flex:0 0 auto;padding:12px 16px 16px;border-top:1px solid rgb(51 40 30 / .07);
  background:linear-gradient(#fffaf200,#fffaf2 30%);display:flex;gap:9px;align-items:center;
}
.btn{
  font-family:var(--fd);font-weight:700;border:0;border-radius:var(--btn-r);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .12s ease,filter .12s ease;
}
.btn:active{transform:scale(.97);filter:brightness(.95)}
.btn.block{flex:1;width:100%;height:48px;font-size:15px}
.btn.primary{background:var(--grass500);color:#fff;box-shadow:0 4px 14px -6px rgb(34 197 94 / .7)}
.btn.sun{background:var(--sun400);color:var(--ink900);box-shadow:0 4px 14px -6px rgb(251 191 36 / .7)}
.btn.dark{background:var(--ink900);color:#fff}
.btn.ghost{background:#fff;color:var(--ink700);box-shadow:var(--hairline)}
.btn[disabled]{background:var(--ink100);color:var(--ink500);box-shadow:none;cursor:default;filter:none}
.btn .ico{font-size:16px}

/* ---------- 家长视角 ---------- */
.parenttag{
  display:inline-flex;align-items:center;gap:5px;background:var(--grape100);color:#5b21b6;
  font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;font-family:var(--fd);
}
.block{background:#fff;border-radius:var(--card-r);padding:14px;box-shadow:var(--shadow-flat),var(--hairline);margin:0 16px 12px}
.block h3{font-family:var(--fd);font-size:14px;font-weight:700;margin:0 0 10px}
.itemrow{display:flex;gap:11px;align-items:center}
.itemrow .thumb{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 auto}
.itemrow .n{font-size:14px;font-weight:600}
.itemrow .s{font-size:11px;color:var(--ink500);margin-top:3px}

.stepper{display:flex;align-items:center;gap:0;background:var(--paper2);border-radius:var(--btn-r);padding:4px;box-shadow:var(--hairline)}
.stepper button{
  width:38px;height:38px;border:0;background:#fff;border-radius:10px;cursor:pointer;
  font-size:18px;color:var(--ink700);box-shadow:var(--hairline);
}
.stepper .val{flex:1;text-align:center;font-family:var(--fd);font-size:19px;font-weight:700}
.stepper .val small{font-size:11px;color:var(--ink500);font-weight:400;margin-left:3px}

.tip{
  display:flex;gap:8px;font-size:11.5px;line-height:1.55;color:var(--ink600);
  background:var(--sun100);border-radius:12px;padding:9px 11px;margin-top:10px;
}
.tip.blue{background:var(--sky100);color:#075985}
.tip .i{flex:0 0 auto}

.rowline{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:13px;border-bottom:1px solid rgb(51 40 30 / .06)}
.rowline:last-child{border-bottom:0}
.rowline .k{color:var(--ink500);font-size:12px}
.rowline .v{font-family:var(--fd);font-weight:700}

.switchrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0}
.toggle{width:44px;height:26px;border-radius:999px;background:var(--ink200);position:relative;flex:0 0 auto;transition:background .18s}
.toggle.on{background:var(--grass500)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .18s;box-shadow:0 1px 3px rgb(51 40 30 / .25)}
.toggle.on::after{left:21px}

/* ---------- 底栏 ---------- */
.tabbar{
  flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);
  border-top:1px solid rgb(51 40 30 / .08);background:var(--paper);padding:7px 4px 9px;
}
.tab{
  border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-family:var(--fb);font-size:10.5px;color:var(--ink500);cursor:pointer;padding:2px 0;position:relative;
}
.tab .e{font-size:19px;line-height:1.15;filter:grayscale(1) opacity(.55)}
.tab.on{color:var(--grass700);font-weight:700}
.tab.on .e{filter:none}
.tab .dot{position:absolute;top:-1px;right:calc(50% - 18px);width:7px;height:7px;border-radius:50%;background:var(--berry500);border:1.5px solid var(--paper)}

/* ---------- 开箱 ---------- */
.openbox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0 24px;text-align:center}
.boxart{
  width:150px;height:150px;border-radius:32px;background:var(--sun100);
  display:flex;align-items:center;justify-content:center;font-size:74px;
  box-shadow:var(--shadow-float),var(--hairline);margin-bottom:6px;
}
.ray{font-size:11px;letter-spacing:3px;color:var(--sun500);font-family:var(--fd);font-weight:700;margin-bottom:14px}
.openbox h2{font-family:var(--fd);font-size:23px;font-weight:700;margin:0 0 6px}
.openbox .sub{font-size:13px;color:var(--ink600);line-height:1.6;margin:0}
.reveal{
  display:flex;align-items:center;gap:11px;background:#fff;border-radius:var(--card-r);
  padding:12px;margin-top:18px;box-shadow:var(--shadow-float),var(--hairline);width:100%;text-align:left;
}
.reveal .thumb{width:54px;height:54px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:27px;flex:0 0 auto}
.reveal .n{font-family:var(--fd);font-size:15px;font-weight:700}
.reveal .s{font-size:11.5px;color:var(--ink500);margin-top:3px}

.sectionlabel{font-size:11px;color:var(--ink500);padding:0 16px;margin:16px 0 8px;font-weight:600;letter-spacing:.4px}

.hintline{font-size:11px;color:var(--ink500);line-height:1.55;padding:0 16px;margin-top:10px;text-align:center}
</style>
</head>
<body>

<div class="switch" id="switch"></div>
<div class="phone">
  <div class="statusbar">
    <span>9:41</span>
    <span class="dots"><i></i><i></i><i></i><i></i><span class="bat"></span></span>
  </div>

<script>

  sun:{bg:'var(--sun100)'}, grass:{bg:'var(--grass100)'}, sky:{bg:'var(--sky100)'},
  grape:{bg:'var(--grape100)'}, tan:{bg:'var(--tan100)'}, berry:{bg:'var(--berry100)'}

];

const tabbar = (active='wish') => `
  <nav class="tabbar">${TABS.map(t=>`
    <button class="tab ${t.k===active?'on':''}">
      <span class="e">${t.e}</span><span>${t.l}</span>
      ${t.dot?'<span class="dot"></span>':''}
    </button>`).join('')}</nav>`;

/* ============ 3. 已表明意向 ============ */
const S_WISHED = `

  <div class="navbar">

  offer:  {label:'⑤ 家长 · 定价', html:S_OFFER},
  confirm:{label:'⑥ 家长 · 确认购买', html:S_CONFIRM},
  box:    {label:'⑦ 开盲盒', html:S_BOX},
};

let cur = 'mall';
const screenEl = document.getElementById('screen');
const switchEl = document.getElementById('switch');

function render(){
  screenEl.innerHTML = SCREENS[cur].html;
  switchEl.innerHTML = Object.entries(SCREENS).map(([k,v])=>
    `<button class="${k===cur?'on':''}" data-go="${k}">${v.label}</button>`).join('');
}

document.addEventListener('click', (e)=>{
  const t = e.target.closest('[data-go]');
  if(!t) return;
  cur = t.dataset.go;
  render();
});
