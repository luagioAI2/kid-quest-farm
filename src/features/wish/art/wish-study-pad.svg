<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 72" fill="none">
  <ellipse cx="48" cy="64" rx="29" ry="3.2" fill="#8A3E12" opacity=".14"/>

  <!--
    这台机器长什么样，是这一张的核心判断：
    ⚠️ 上一版是「白色圆角矩形 + 一圈浅蓝内屏」—— 在 sky-100 的底上，
       白机身、浅蓝屏、浅蓝底三件几乎同一个明度 ⇒ 整张读成「一块白板」，
       一点不吸引人。而且「白板」也说不清是平板还是微波炉。
    ➜ 换成**儿童平板的橙色防摔套**：套子给体积和暖色，白机身只剩一圈窄边，
      屏里放进度柱。一眼就是「孩子的学习机」，且和冷色底分开。
  -->
  <rect x="12" y="15" width="72" height="50" rx="11" fill="#E8894F"/>
  <rect x="10" y="13" width="72" height="50" rx="11" fill="#FFA870"/>

  <!-- 白机身：比套子内缩 5，四周一圈窄边 -->
  <rect x="15" y="17" width="62" height="42" rx="7" fill="#FFFFFF"/>

  <!-- 屏：四周边框左 6 / 右 6 / 上 5 / 下 9，下边留宽才放得下指示条 -->
  <rect x="21" y="22" width="50" height="28" rx="2" fill="#E3F0FB"/>

  <!-- 屏里的内容：三根学习进度柱，左低右高 -->
  <rect x="25" y="38" width="6" height="9" rx="1.6" fill="#FFB43F"/>
  <rect x="33.5" y="33" width="6" height="14" rx="1.6" fill="#58A8D6"/>
  <rect x="42" y="27.5" width="6" height="19.5" rx="1.6" fill="#82C95E"/>

  <!-- 屏里的内容：两行字，抽象成两块圆头色块（真写字在 153px 下是噪点） -->
  <rect x="51" y="27" width="15" height="2.8" rx="1.4" fill="#BFD8EE"/>
  <rect x="51" y="32.5" width="10" height="2.8" rx="1.4" fill="#D3E4F4"/>

  <!-- 星：这一套里唯一的「奖励」信号，压在右下角 -->
  <g transform="translate(58.5 42)">
    <path d="M0 -5 L1.234 -1.699 L4.755 -1.545 L1.997 .649 L2.939 4.045 L0 2.1 L-2.939 4.045 L-1.997 .649 L-4.755 -1.545 L-1.234 -1.699 Z" fill="#FFC94D"/>
  </g>

  <!-- 前摄（左窄边中点）+ 底部指示条：两个小件，把「圆角矩形」钉成「设备」 -->
  <circle cx="18" cy="38" r="1.5" fill="#CFDCE8"/>
  <rect x="39" y="54.6" width="12" height="2.2" rx="1.1" fill="#DCE9F6"/>
</svg>
