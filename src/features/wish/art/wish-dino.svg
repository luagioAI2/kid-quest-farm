<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 72" fill="none">
  <ellipse cx="46" cy="64" rx="31" ry="3.2" fill="#2F5A22" opacity=".14"/>

  <!-- 大恐龙（绿）：脖子用粗圆头线连身体和头，接缝自然消失 -->
  <path d="M24 45.4 8.6 52.6 24 55.4Z" fill="#5FA83E"/>
  <path d="M52 40.6 60.4 28.4" stroke="#6FBF4A" stroke-width="13" stroke-linecap="round"/>

  <!--
    背板：两片，越靠后越小。
    ⚠️ 顺序是「脖子 → 背板 → 身体」：背板**画在身体之前**，底边埋进背里被身体盖掉。
       上一版画在身体之后，底边就成了一条横在肚子上的深绿直线；
       再上一版底边正好落在背的轮廓上，远看是两个三角悬着。
  -->
  <path d="M31.4 45 36.6 27.6 41.8 45Z" fill="#4E9B33"/>
  <path d="M43.4 45 47.4 28.8 51.4 45Z" fill="#4E9B33"/>

  <ellipse cx="40" cy="46" rx="17" ry="11.6" fill="#6FBF4A"/>
  <ellipse cx="39" cy="50.6" rx="11.4" ry="6.6" fill="#A8DE86"/>
  <circle cx="63" cy="26" r="9.4" fill="#6FBF4A"/>
  <ellipse cx="71" cy="28.4" rx="5.2" ry="4" fill="#7FCB5A"/>

  <!-- 腿：前腿亮一档，才有前后 -->
  <rect x="29.6" y="53.6" width="7" height="9.6" rx="3.2" fill="#6FBF4A"/>
  <rect x="43.6" y="53.6" width="7" height="9.6" rx="3.2" fill="#5FA83E"/>

  <!-- 眼睛：白点压在瞳孔右上，不然是一坨黑 -->
  <circle cx="64.6" cy="23.8" r="1.9" fill="#1F3016"/>
  <circle cx="65.2" cy="23.2" r=".6" fill="#FFFFFF"/>

  <!-- 小恐龙（橙）：缩一圈、错开站位，读成「一套两只」 -->
  <path d="M74.4 52 66 56.6 74.4 58Z" fill="#E58B3C"/>
  <path d="M80.4 52.6 84.2 47.4" stroke="#F09A4C" stroke-width="7" stroke-linecap="round"/>
  <!-- 同样：背板在小身体之前，底边埋进去 -->
  <path d="M71.4 56 74.6 44.6 77.8 56Z" fill="#D9762A"/>
  <ellipse cx="76" cy="54.6" rx="9" ry="6.4" fill="#F09A4C"/>
  <circle cx="85.2" cy="45.6" r="5.2" fill="#F09A4C"/>
  <ellipse cx="89.4" cy="47" rx="2.8" ry="2.2" fill="#F7B26E"/>
  <rect x="71.6" y="58.6" width="4" height="5.4" rx="2" fill="#F09A4C"/>
  <rect x="79.4" y="58.6" width="4" height="5.4" rx="2" fill="#E58B3C"/>
  <circle cx="86" cy="44.4" r="1.1" fill="#3A2410"/>
</svg>
