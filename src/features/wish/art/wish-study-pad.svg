<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 72" fill="none">
  <ellipse cx="46" cy="64" rx="28" ry="3.2" fill="#1E4A72" opacity=".13"/>

  <!-- 平板：白机身 + 浅蓝屏，机身右下压一道冷色才有厚度 -->
  <rect x="14" y="9" width="54" height="51" rx="7" fill="#FFFFFF"/>
  <rect x="62" y="9" width="6" height="51" rx="3" fill="#DCE9F6"/>
  <rect x="19" y="14" width="44" height="35" rx="3" fill="#EAF4FF"/>
  <rect x="19" y="14" width="44" height="35" rx="3" fill="#FFFFFF" opacity=".5"/>

  <!-- 屏里的内容：三根柱子（学习进度）+ 一颗星 -->
  <rect x="25" y="36" width="6.4" height="9" rx="1.6" fill="#FFC247"/>
  <rect x="34.6" y="31" width="6.4" height="14" rx="1.6" fill="#7FC8F0"/>
  <rect x="44.2" y="25.6" width="6.4" height="19.4" rx="1.6" fill="#A8DE86"/>
  <circle cx="29" cy="24.4" r="4.2" fill="#FF6FA8"/>
  <circle cx="57" cy="24.4" r="2" fill="#C8A2F0"/>

  <!-- 底部 Home 键 -->
  <circle cx="41" cy="54.6" r="2.4" fill="#D6E4F2"/>

  <!-- 触控笔：斜着靠在右边，笔尖朝下 -->
  <g transform="rotate(18 76 34)">
    <rect x="72.6" y="14" width="6.4" height="34" rx="3.2" fill="#8FC7E8"/>
    <rect x="72.6" y="14" width="2.4" height="34" rx="1.2" fill="#FFFFFF" opacity=".5"/>
    <path d="M72.6 48h6.4l-3.2 5.4Z" fill="#5E93B8"/>
  </g>

  <!-- 星：这一套里唯一的「奖励」信号 -->
  <path d="M80.6 51.2l1.7 3.4 3.8.6-2.8 2.6.7 3.7-3.4-1.8-3.4 1.8.7-3.7-2.8-2.6 3.8-.6Z" fill="#FFD264"/>
</svg>
