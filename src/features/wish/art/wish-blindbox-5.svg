    <rect x="29" y="26" width="4" height="17" fill="#FFD264"/>
  </g>
  <g>
    <rect x="44" y="28" width="22" height="13" rx="2.4" fill="#EF6C5A"/>
    <rect x="42.5" y="24" width="25" height="5.6" rx="2.4" fill="#F58C7C"/>
    <rect x="51" y="24" width="4" height="17" fill="#FFD264"/>
