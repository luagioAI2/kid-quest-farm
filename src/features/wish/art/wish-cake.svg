<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 72" fill="none">
  <!-- 落地阴影：中性暖褐，六种底色上都压得住 -->
  <ellipse cx="48" cy="64.2" rx="26" ry="3.2" fill="#5A3A1E" opacity=".13"/>

  <!-- 盘子 -->
  <ellipse cx="48" cy="60.4" rx="30" ry="5.2" fill="#F3D9DE"/>
  <ellipse cx="48" cy="59.4" rx="30" ry="5.2" fill="#FFFFFF"/>

  <!-- 下层蛋糕 -->
  <rect x="23" y="41" width="50" height="18" rx="3" fill="#FFF7EA"/>
  <rect x="23" y="41" width="50" height="18" rx="3" fill="#FFFFFF" opacity=".6"/>
  <rect x="23" y="41" width="50" height="6.4" fill="#FF93AE"/>
  <g fill="#FF93AE">
    <circle cx="27.4" cy="47.4" r="3.1"/>
    <circle cx="35.2" cy="47.4" r="3.1"/>
    <circle cx="43" cy="47.4" r="3.1"/>
    <circle cx="50.8" cy="47.4" r="3.1"/>
    <circle cx="58.6" cy="47.4" r="3.1"/>
    <circle cx="66.4" cy="47.4" r="3.1"/>
  </g>

  <!-- 上层蛋糕 -->
  <rect x="34" y="27" width="28" height="14" rx="3" fill="#FFF7EA"/>
  <rect x="34" y="27" width="28" height="14" rx="3" fill="#FFFFFF" opacity=".6"/>
  <rect x="34" y="27" width="28" height="5.6" fill="#FF93AE"/>
  <g fill="#FF93AE">
    <circle cx="37.8" cy="32.6" r="2.7"/>
    <circle cx="44.6" cy="32.6" r="2.7"/>
    <circle cx="51.4" cy="32.6" r="2.7"/>
    <circle cx="58.2" cy="32.6" r="2.7"/>
  </g>

  <!-- 蜡烛：中间那根高一点，三根不等高才不像栏杆 -->
  <g fill="#8FC7E8">
    <rect x="40.4" y="16.4" width="2.8" height="10.6" rx="1.4"/>
    <rect x="46.6" y="13.6" width="2.8" height="13.4" rx="1.4"/>
    <rect x="52.8" y="16.4" width="2.8" height="10.6" rx="1.4"/>
  </g>

  <!--
    火苗：**上尖下圆的水滴**，不是椭圆。
    ⚠️ 上一版是 `ellipse rx2 ry3.1` —— 在 358px 下就是三个橙色鸡蛋插在蜡烛上。
       水滴形只多两个控制点，但「火」是形状认出来的，不是颜色认出来的。
  -->
  <g fill="#FFC247">
    <path d="M41.8 10C43.3 12.2 44 13.8 44 14.8A2.2 2.2 0 0 1 39.6 14.8C39.6 13.8 40.3 12.2 41.8 10Z"/>
    <path d="M48 7.2C49.5 9.4 50.2 11 50.2 12A2.2 2.2 0 0 1 45.8 12C45.8 11 46.5 9.4 48 7.2Z"/>
    <path d="M54.2 10C55.7 12.2 56.4 13.8 56.4 14.8A2.2 2.2 0 0 1 52 14.8C52 13.8 52.7 12.2 54.2 10Z"/>
  </g>
  <g fill="#FF8A3D">
    <path d="M41.8 12.2C42.6 13.3 42.9 14 42.9 14.6A1.1 1.1 0 0 1 40.7 14.6C40.7 14 41 13.3 41.8 12.2Z"/>
    <path d="M48 9.4C48.8 10.5 49.1 11.2 49.1 11.8A1.1 1.1 0 0 1 46.9 11.8C46.9 11.2 47.2 10.5 48 9.4Z"/>
    <path d="M54.2 12.2C55 13.3 55.3 14 55.3 14.6A1.1 1.1 0 0 1 53.1 14.6C53.1 14 53.4 13.3 54.2 12.2Z"/>
  </g>

  <!-- 彩针：只放四颗，再多在下层就成了噪点 -->
  <g opacity=".9">
    <rect x="29" y="54" width="4.4" height="1.9" rx=".95" fill="#FFC247" transform="rotate(-20 31.2 55)"/>
    <rect x="40" y="52" width="4.4" height="1.9" rx=".95" fill="#8FD3EE" transform="rotate(16 42.2 53)"/>
    <rect x="51" y="55" width="4.4" height="1.9" rx=".95" fill="#A8DE86" transform="rotate(-12 53.2 56)"/>
    <rect x="60" y="52" width="4.4" height="1.9" rx=".95" fill="#C8A2F0" transform="rotate(22 62.2 53)"/>
  </g>
</svg>
