<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 72" fill="none">
  <ellipse cx="46" cy="63" rx="29" ry="3.2" fill="#7A4A18" opacity=".13"/>

  <!-- 三片拼好的：右上角那片压着左上角，接缝才不「一刀切」 -->
  <g>
    <rect x="18" y="10" width="22" height="22" rx="3.4" fill="#FFC247"/>
    <rect x="18" y="10" width="22" height="22" rx="3.4" fill="#FFFFFF" opacity=".22"/>
    <circle cx="40" cy="21" r="4.6" fill="#FFC247"/>
  </g>
  <g>
    <rect x="40" y="10" width="22" height="22" rx="3.4" fill="#7FC8F0"/>
    <rect x="40" y="10" width="22" height="22" rx="3.4" fill="#FFFFFF" opacity=".22"/>
    <circle cx="62" cy="21" r="4.6" fill="#7FC8F0"/>
    <circle cx="51" cy="32" r="4.6" fill="#7FC8F0"/>
  </g>
  <g>
    <rect x="18" y="32" width="22" height="22" rx="3.4" fill="#A8DE86"/>
    <rect x="18" y="32" width="22" height="22" rx="3.4" fill="#FFFFFF" opacity=".22"/>
    <circle cx="40" cy="43" r="4.6" fill="#A8DE86"/>
  </g>

  <!-- 空位：虚线框 + 一个浅浅的缺口，读成「还差一块」 -->
  <rect x="40" y="32" width="22" height="22" rx="3.4" fill="#FFFFFF" opacity=".5"/>
  <rect x="40.9" y="32.9" width="20.2" height="20.2" rx="2.8" stroke="#C9A87A" stroke-width="1.2" stroke-dasharray="2.6 2.4"/>

  <!-- 掉在右下角的那一块：歪着放，才像「还没放进去」 -->
  <g transform="rotate(-14 78 46)">
    <rect x="67" y="35" width="22" height="22" rx="3.4" fill="#C8A2F0"/>
    <rect x="67" y="35" width="22" height="22" rx="3.4" fill="#FFFFFF" opacity=".24"/>
    <circle cx="89" cy="46" r="4.6" fill="#C8A2F0"/>
  </g>
</svg>
