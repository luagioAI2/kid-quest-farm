<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 72" fill="none">
  <ellipse cx="48" cy="64" rx="25" ry="3.2" fill="#4B2A6B" opacity=".14"/>

  <!-- 盒子里探出头的小公仔：先画，盒沿压住下半截才像「从里面出来」 -->
  <g>
    <rect x="41" y="34" width="14" height="10" rx="5" fill="#FFF6E6"/>
    <circle cx="37.6" cy="17.6" r="4.6" fill="#FFF6E6"/>
    <circle cx="58.4" cy="17.6" r="4.6" fill="#FFF6E6"/>
    <circle cx="37.6" cy="17.6" r="2.2" fill="#FFC8D6"/>
    <circle cx="58.4" cy="17.6" r="2.2" fill="#FFC8D6"/>
    <circle cx="48" cy="26" r="11.8" fill="#FFF6E6"/>
    <circle cx="43.8" cy="25.2" r="1.6" fill="#3A2410"/>
    <circle cx="52.2" cy="25.2" r="1.6" fill="#3A2410"/>
    <ellipse cx="40.6" cy="29.4" rx="2.4" ry="1.5" fill="#FFB3C6"/>
    <ellipse cx="55.4" cy="29.4" rx="2.4" ry="1.5" fill="#FFB3C6"/>
    <path d="M46.4 30.2c1 1.2 2.2 1.2 3.2 0" stroke="#3A2410" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M48 14.4v-2.2" stroke="#FFC247" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="48" cy="10.4" r="2" fill="#FFC247"/>
  </g>

  <!--
    掀开的盖子：斜靠在**盒子左侧**、右端被盒身压住。
    ⚠️ 原来画在右上角悬空 ⇒ 一眼是一根黄棍子（详情大图里最明显）。
    盖子必须有一条更暗的下沿，才像一块有厚度的板，而不是一条色带。
  -->
  <g transform="rotate(-27 24 42)">
    <rect x="3" y="36.6" width="31" height="7.6" rx="2.8" fill="#FFC247"/>
    <rect x="3" y="36.6" width="31" height="2.6" rx="1.3" fill="#FFD97A"/>
    <rect x="3" y="42.4" width="31" height="1.8" rx=".9" fill="#DFA118"/>
  </g>

  <!-- 盒子 -->
  <rect x="26" y="40" width="44" height="22" rx="3" fill="#FF8FA8"/>
  <rect x="26" y="40" width="44" height="22" rx="3" fill="#FFFFFF" opacity=".16"/>
  <rect x="26" y="52" width="44" height="10" rx="3" fill="#E0607C" opacity=".45"/>
  <rect x="24.6" y="37.6" width="46.8" height="6" rx="2.6" fill="#E0607C"/>
  <rect x="27" y="37.6" width="42" height="2" rx="1" fill="#C24A66" opacity=".5"/>

  <!-- 彩纸屑：只放六粒，再多就成了噪点 -->
  <g opacity=".9">
    <circle cx="21" cy="28" r="2" fill="#C8A2F0"/>
    <circle cx="75.6" cy="42" r="1.7" fill="#8FD3EE"/>
    <rect x="16.6" y="45" width="4.4" height="2" rx="1" fill="#FFC247" transform="rotate(24 18.8 46)"/>
    <rect x="72" y="52" width="4.4" height="2" rx="1" fill="#A8DE86" transform="rotate(-18 74.2 53)"/>
    <circle cx="30" cy="19.6" r="1.4" fill="#8FD3EE"/>
    <circle cx="66" cy="34.6" r="1.4" fill="#FFC247"/>
  </g>
</svg>
